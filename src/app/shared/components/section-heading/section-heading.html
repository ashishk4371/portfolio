<div class="heading">
  @if (eyebrow()) {
    <p class="eyebrow">
      @if (eyebrowIcon(); as icon) {
        <app-icon [name]="icon" />
      }
      {{ eyebrow() }}
    </p>
  }

  @if (level() === 2) {
    <h2 class="heading__title display-3">{{ title() }}</h2>
  } @else {
    <h3 class="heading__title heading-lg">{{ title() }}</h3>
  }

  @if (lede()) {
    <p class="heading__lede body-lg">{{ lede() }}</p>
  }
</div>
