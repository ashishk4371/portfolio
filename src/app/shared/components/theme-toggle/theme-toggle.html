<div class="toggle" role="radiogroup" aria-label="Colour theme">
  <span class="toggle__indicator" [style.--index]="indexOf(preference())" aria-hidden="true"></span>

  @for (option of options; track option.value) {
    <button
      type="button"
      role="radio"
      class="toggle__option"
      [class.is-active]="preference() === option.value"
      [attr.aria-checked]="preference() === option.value"
      [attr.title]="option.label + ' theme'"
      (click)="select(option.value)"
    >
      <app-icon [name]="option.icon" size="1rem" />
      <span class="visually-hidden">{{ option.label }} theme</span>
    </button>
  }
</div>
