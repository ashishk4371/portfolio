@if (interactive()) {
  <button
    type="button"
    class="chip chip--button"
    [class.chip--active]="active()"
    [class.chip--sm]="isSmall()"
    [attr.aria-pressed]="active()"
    (click)="onSelect()"
  >
    <span class="chip__label">{{ label() }}</span>
    @if (count() !== null) {
      <span class="chip__count">{{ count() }}</span>
    }
  </button>
} @else {
  <span class="chip" [class.chip--active]="active()" [class.chip--sm]="isSmall()">
    <span class="chip__label">{{ label() }}</span>
  </span>
}
