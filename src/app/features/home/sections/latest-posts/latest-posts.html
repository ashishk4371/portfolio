<div class="container">
  <div class="header" appReveal>
    <app-section-heading
      eyebrow="Writing"
      eyebrowIcon="code"
      title="Notes from the work"
      lede="Post-mortems, migrations and the occasional strong opinion about testing."
    />

    <a class="btn btn--secondary header__link" routerLink="/blog">
      All posts
      <app-icon name="arrow-right" size="0.9rem" />
    </a>
  </div>

  @if (posts().length) {
    <div class="grid">
      @for (post of posts(); track post.slug; let i = $index) {
        <app-post-card [post]="post" appReveal [appRevealDelay]="i * 90" />
      }
    </div>
  }
</div>
