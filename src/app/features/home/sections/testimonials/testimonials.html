<div class="container">
  <app-section-heading eyebrow="References" eyebrowIcon="quote" title="What people say" centered appReveal />

  <ul class="grid">
    @for (item of testimonials; track item.id; let i = $index) {
      <li class="quote" appReveal [appRevealDelay]="i * 90">
        <app-icon class="quote__mark" name="quote" size="1.5rem" />

        <figure>
          <blockquote class="quote__text">{{ item.quote }}</blockquote>

          <figcaption class="quote__author">
            <span class="quote__avatar" aria-hidden="true">{{ item.author.charAt(0) }}</span>
            <span>
              <span class="quote__name">{{ item.author }}</span>
              <span class="quote__role">{{ item.role }}, {{ item.company }}</span>
            </span>
          </figcaption>
        </figure>
      </li>
    }
  </ul>
</div>
