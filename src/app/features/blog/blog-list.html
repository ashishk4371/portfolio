<h1>Blog</h1>

<ul class="entries">
  @for (post of posts(); track post.slug) {
    <li>
      <h2>
        <a [routerLink]="['/blog', post.slug]">{{ post.title }}</a>
      </h2>
      <p class="muted">
        <time [attr.datetime]="post.date">{{ post.date | appDate: 'long' }}</time>
        · {{ post.readingTime }} min read
      </p>
      <p>{{ post.description }}</p>
    </li>
  }
</ul>
