@if (post(); as post) {
  <article>
    <p><a routerLink="/blog">&larr; All posts</a></p>

    <h1>{{ post.title }}</h1>
    <p class="muted">
      <time [attr.datetime]="post.date">{{ post.date | appDate: 'long' }}</time>
      · {{ post.readingTime }} min read
    </p>

    <!-- Trusted HTML produced by renderMarkdown() from markdown shipped in this repository. -->
    <div class="prose" [innerHTML]="html() | appSafeHtml"></div>
  </article>
} @else {
  <h1>Post not found</h1>
  <p>That post does not exist, or it is still a draft.</p>
  <p><a routerLink="/blog">Browse all posts</a></p>
}
