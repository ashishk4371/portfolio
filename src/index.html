<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Ashish Kumar — Software Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Software engineer building fast, accessible products with TypeScript, Angular, Node.js and Go."
    />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0a0b10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>

    <!--
      Applied before first paint so the stored theme is in place by the time the
      document renders. Inlined deliberately: any async alternative reintroduces
      the flash of wrong theme this exists to prevent.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio.theme');
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        } catch (e) {
          document.documentElement.dataset.theme = 'system';
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <p style="padding: 2rem; text-align: center">
        This site is fully readable without JavaScript, but interactive features (theme toggle, filtering,
        animations) require it to be enabled.
      </p>
    </noscript>
  </body>
</html>
