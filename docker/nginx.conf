# ---------------------------------------------------------------------------
# nginx config for the STATIC deployment path.
#
# Every route in this site is prerendered, so `dist/portfolio/browser` can be
# served as plain files with no Node process at all. Use this when you do not
# need on-demand SSR; use the Dockerfile when you do.
#
#   npm run build
#   cp -r dist/portfolio/browser/* /usr/share/nginx/html/
# ---------------------------------------------------------------------------

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular emits content-hashed filenames, so build assets are immutable.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|avif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # HTML must always be revalidated, or a deploy will not reach returning
  # visitors until their cache expires.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Prerendered routes are directories containing index.html. Falling back to
  # /index.html lets the client-side router handle anything not prerendered.
  location / {
    try_files $uri $uri/index.html /index.html;
  }

  location = /404.html {
    internal;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Baseline hardening. Add a Content-Security-Policy once you know which
  # third-party origins (analytics, fonts) the deployment actually uses.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
