name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the in-flight run rather than queueing
# behind it — the older result is never the one anyone wants.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      - name: Build (prerender all routes)
        run: npm run build

      # Guards against a regression that quietly disables prerendering — the
      # build still succeeds, but every route would start rendering on demand.
      - name: Verify prerendered output
        run: |
          test -f dist/portfolio/browser/index.html
          test -f dist/portfolio/browser/blog/index.html
          test -f dist/portfolio/browser/sitemap.xml
          echo "Prerendered $(find dist/portfolio/browser -name index.html | wc -l) route(s)."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
